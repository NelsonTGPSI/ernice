<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Obrigado! | Ernice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Obrigado pelo seu contato! Em breve a Ernice responderá sua mensagem.">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(120deg, #232526 0%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        .agradecimento-box {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px #0003;
            padding: 48px 32px 40px 32px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .agradecimento-box img {
            width: 64px;
            height: 64px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #23252630;
            object-fit: cover;
        }
        .agradecimento-box h1 {
            color: #6366f1;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .agradecimento-box p {
            color: #232526;
            margin-bottom: 28px;
            font-size: 1.13em;
        }
        .btn-accent {
            background: linear-gradient(90deg, #6366f1 0%, #25d366 100%);
            color: #fff;
            border: none;
            font-weight: 600;
            border-radius: 32px;
            padding: 0.85em 2.2em;
            box-shadow: 0 4px 24px #6366f140;
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-accent:hover, .btn-accent:focus {
            background: linear-gradient(90deg, #25d366 0%, #6366f1 100%);
            box-shadow: 0 8px 32px #25d36660;
            transform: scale(1.04);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="agradecimento-box">
        <img src="img/logo.png" alt="Logo Ernice">
        <h1>Mensagem enviada com sucesso!</h1>
        <p>Obrigado pelo seu contato.<br>Em breve a equipa Ernice irá responder.</p>
        <a class="btn-accent" href="index.html">Voltar ao site</a>
    </div>
</body>
</html>
